spring:
  datasource:
    url: jdbc:h2:file:./data/taskflow;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
app:
  name: TaskFlow Database
server:
  port: 8080
